<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparar Eventos</title>
    <style>
        /* Adicione o estilo da sua div aqui para ela aparecer na tela */
        div#area {
            background: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Disparar eventos com listener</h1>
    <p>Além de disparar eventos dentro do HTML, podemos disparar utilizando listener dentro do JS.</p>

    <div id="area">Interaja</div>

    <script>
        // Correção aqui: selecionando a div correta pelo ID #area
        var a = document.querySelector('div#area')

        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)

        function clicar() {
            a.innerHTML = 'Clicou'
            a.style.background = 'purple'
        }

        function entrar() {
            a.innerHTML = 'Entrou'
            a.style.background = 'blue'
        }

        function sair() {
            a.innerHTML = 'Saiu'
            a.style.background = 'red'
        }
    </script>
    <a href="../ex00.html">Volte para a homepage</a>
</body>
</html>
