
  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        /* Adicione o estilo da sua div aqui para ela aparecer na tela */
        div#area {
            background: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Eventos DOM</h1>
    
    <div id="area" onclick="clicar()" onmouseenter="entrou()" onmouseout="saiu()">
        Interaja
    </div>

    <p>Eventos DOM: mouseenter; mouseout; mousemove; mouseup; mousedown; click</p>

    <script>
        function clicar() {
            var a = document.getElementById('area')
            a.innerText = 'clicou'
            a.style.background = 'black' // Nota: Corrigido o formato rgb da imagem para ser válido
        }

        function entrou() {
            var a = document.getElementById('area')
            a.innerText = 'entrou'
            a.style.background = 'blue'
        }

        function saiu() {
            var a = document.getElementById('area')
            a.innerText = 'saiu'
            a.style.background = 'red'
        }
    </script>
    
</body>
</html>

</body>
</html>
